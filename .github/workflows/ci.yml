name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang llvm-dev

      - name: Configure
        run: cmake -S . -B cmake-build-fluxion-vm -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build cmake-build-fluxion-vm --target fluxion --parallel

      - name: Test
        run: ctest --test-dir cmake-build-fluxion-vm --output-on-failure
